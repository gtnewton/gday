# /etc/gday/gday.conf — g'day configuration (CLAUDE.md §13).
# Shell-sourced KEY=value. Precedence: compiled defaults < this file < CLI.
# Invalid integer values warn to stderr/journal and fall back to the default.
# An invalid value MUST NOT abort g'day (§5).

# ── Sections ────────────────────────────────────────────────────────────────
# Space-separated list of sections to include, in the fixed render order (§9).
# Remove a name to omit that section from the MOTD.
# Default: all sections.
#GDAY_SECTIONS='banner hardware network disk os status packages'

# ── Login banner style ──────────────────────────────────────────────────────
# What /etc/motd shows at login:
#   brief — banner, one summary line, and only what needs attention
#           (updates, reboot, failed units, SMART, alerts, full disks,
#           ⚠️/❌ plugin lines), or "All clear".
#   full  — the complete report (all sections).
# Either way the full report is saved each refresh; `gday --full` prints it.
#GDAY_MOTD_STYLE=brief

# Brief mode lists a mount only at or above this percent used (0–100).
#GDAY_BRIEF_DISK_PCT=85

# ── Banner override ───────────────────────────────────────────────────────────
# When set and readable, its content replaces the figlet/toilet/box art
# verbatim (e.g. a fixed department logo instead of a hostname render). Tabs
# are expanded; over-wide lines are truncated and the file is capped at 20
# lines. Static-tier cached like the rest of the banner: after changing this
# file's content, run `gday --refresh` (or `--static`) to pick it up — it
# does not take effect until the next static-tier fire otherwise.
#GDAY_BANNER_FILE=/etc/gday/banner.txt

# Set to 0 to suppress the computed "<host> · <PRETTY_NAME> · <DE · session>"
# subtitle line below the banner art (default: on). Useful alongside
# GDAY_BANNER_FILE, where the computed subtitle rarely fits a fixed logo.
#GDAY_BANNER_SUBTITLE=1

# ── Network ─────────────────────────────────────────────────────────────────
# Interface to report on. Default: the dev of the default route with the
# lowest metric (from `ip -4 route show default`). No default route and no
# override ⇒ the NETWORK section is omitted entirely.
#GDAY_NET_IFACE=eth0

# ── Disk usage ──────────────────────────────────────────────────────────────
# Shell glob patterns (space-separated) for mount points to show.
# If GDAY_DISK_INCLUDE is set, only matching mounts appear.
#GDAY_DISK_INCLUDE='/ /home /data'

# Shell glob patterns for mount points to suppress.
# Applied only when GDAY_DISK_INCLUDE is not set.
#GDAY_DISK_EXCLUDE='/boot/efi'

# ── Rendering ───────────────────────────────────────────────────────────────
# figlet/toilet font for the hostname banner (default: standard).
# Run `figlet -l` or `ls /usr/share/figlet/` to see available fonts.
GDAY_FIGLET_FONT=slant

# Width in cells of the usage bar (default: 22).
#GDAY_BAR_WIDTH=22

# Set to 0 to replace emoji with plain ASCII (for terminals that render emoji
# poorly). Affects section headers and status glyphs.
#GDAY_EMOJI=1

# ── Timers ──────────────────────────────────────────────────────────────────
# These cadences are baked into the systemd timer units by install.sh.
# To change them after install, re-run install.sh or edit the units directly
# (or drop a systemd override in /etc/systemd/system/gday-*.timer.d/).
#
# Static tier: expensive probes (hardware, packages). Default: boot + daily.
#GDAY_STATIC_ONCALENDAR='daily'
#GDAY_STATIC_ONBOOTSEC='30s'
#
# Updates tier: pending update count. Default: hourly.
#GDAY_UPDATES_ONCALENDAR='hourly'
#
# Refresh tier: assemble /etc/motd from caches. Default: every 5 minutes.
#GDAY_REFRESH_INTERVAL='5min'

# ── Alerts ──────────────────────────────────────────────────────────────────
# External health-check producers (gday never runs them itself — see §18)
# write `*.alerts` files here; gday renders their non-PASS rows into STATUS.
# An absent or empty directory is silent — most machines never run one.
#GDAY_ALERTS_DIR=/var/lib/gday/alerts.d

# Age after which a producer's file is considered stale (NNh or NNm). Past
# this, its records are suppressed and a "no report since" line appears
# instead — a three-week-old FAIL is worse than no information.
#GDAY_ALERTS_MAX_AGE=26h

# Cap on alert rows shown per producer; the rest collapse to one
# "… and N more" line. Protects the banner from a runaway producer.
#GDAY_ALERTS_MAX_ROWS=8

# Space-separated producer names (matching their .alerts filename, minus the
# extension) that MUST report. A declared producer with no file, a stale
# file, or a rejected file each gets its own warning line — this is what
# catches "someone deleted the cron job" rather than the section going quiet.
#GDAY_ALERTS_EXPECT=''
